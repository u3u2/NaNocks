<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>VOX</title>
    <style>
        @import url('https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,600,700');

        :root {
            --bg-gray: #e6e6e6;
            --border-gray: #b0b0b0;
            --text-gray: #7d7d7d;
        }

        body {
            font-family: 'Source Sans Pro', sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            padding: 0;
            color: #333;
        }

        .header {
            padding: 15px 40px 5px 40px;
            display: flex;
            align-items: flex-end;
        }

        .logo-container {
            display: flex;
            align-items: flex-end;
        }

        .logo-container img {
            height: 60px;
            width: auto;
            object-fit: contain;
        }

        .navbar {
            border-top: 2px solid var(--border-gray);
            border-bottom: 2px solid var(--border-gray);
            padding: 6px 40px;
            display: flex;
            align-items: center;
            font-size: 24px;
            color: #a0a0a0;
            background-color: #ededed;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-links span {
            color: #a0a0a0;
        }

        .nav-links a {
            color: #a0a0a0;
            text-decoration: none;
        }

        .search-container {
            display: flex;
            align-items: center;
            margin-left: 10px;
            flex-grow: 1;
        }

        .search-container input {
            border: none;
            border-bottom: 2px solid #a0a0a0;
            background: transparent;
            width: 100%;
            max-width: 400px;
            font-size: 20px;
            outline: none;
            padding-left: 5px;
        }

        .main-layout {
            display: flex;
            padding: 30px 40px;
            gap: 40px;
        }

        .sidebar {
            width: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .username-box {
            width: 100%;
            background-color: #d9d9d9;
            border: 1px solid var(--border-gray);
            text-align: center;
            padding: 8px 0;
            font-size: 26px;
            color: #a0a0a0;
            font-weight: 600;
        }

        .avatar-box {
            width: 100%;
            height: 320px;
            background-color: #d9d9d9;
            border: 1px solid var(--border-gray);
            border-top: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
        }

        .avatar-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .content-area {
            flex-grow: 1;
        }

        .section-title {
            font-size: 20px;
            color: #a0a0a0;
            margin-bottom: 15px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .game-thumb-frame {
            border: 6px solid #b0b0b0;
            background-color: #fff;
            width: 100%;
            aspect-ratio: 1.4;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .game-thumb-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-title {
            margin-top: 8px;
            font-size: 22px;
            color: #a0a0a0;
            text-align: center;
        }

        .modal {
            position: fixed;
            z-index: 99;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content.game-menu-bg {
            background-image: url('https://www.image2url.com/r2/default/files/1788363091789-4282fbc1-3238-4cc5-bd53-9329ce97ec52.png');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 20px;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            box-sizing: border-box;
            padding: 40px;
            position: relative;
        }

        .modal-left img {
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid white;
        }

        .modal-right img {
            width: 280px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
        }

        .modal-right img:hover {
            transform: scale(1.05);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 5px #000;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>

    <div id="gameModal" class="modal">

            <div class="modal-left">
                <img id="modalGameThumb" src="" alt="Game Thumbnail">
            </div>
            <div class="modal-right">
                <a id="modalPlayLink" href="#">
                    <img src="https://www.image2url.com/r2/default/files/1788363144412-46895edb-82d4-4d81-80ef-32b4ef8bac05.png" alt="Play Game">
                </a>
            </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('gameModal');
            const modalThumb = document.getElementById('modalGameThumb');
            const modalPlayLink = document.getElementById('modalPlayLink');
            const modalClose = document.getElementById('modalClose');

            document.querySelectorAll('.game-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    e.preventDefault();
                    
                    const targetHref = card.getAttribute('href');
                    const cardImg = card.querySelector('img');
                    const thumbSrc = cardImg ? cardImg.src : '';

                    modalThumb.src = thumbSrc;
                    modalPlayLink.href = targetHref;

                    modal.classList.add('active');
                });
            });

            modalClose.addEventListener('click', () => {
                modal.classList.remove('active');
            });

            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });
    </script>
