<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>VOX - Signup</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      background-color: #f5f5f5;
      font-family: "Times New Roman", Times, serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background-color: #f5f5f5;
      border: 1px solid #ccc;
      width: 100vw;
      height: 100vh;
      padding: 40px 60px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .logo-container {
      flex: 1;
    }

    .logo-img {
      max-width: 250px;
      height: auto;
      display: block;
    }

    .welcome-text {
      flex: 1;
      text-align: right;
    }

    .welcome-text h2 {
      margin: 0;
      font-size: 22px;
      color: #003366;
    }

    .welcome-text p {
      margin: 5px 0 0 0;
      font-size: 16px;
      color: #003366;
    }

    .main-content {
      display: flex;
      gap: 40px;
      margin-top: 10px;
      align-items: center;
    }

    .left-section {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .avatar-img {
      width: 260px;
      height: auto;
      display: block;
    }

    .info-text {
      font-size: 18px;
      line-height: 1.5;
    }

    .info-text p {
      margin: 12px 0;
    }

    .highlight-1 {
      color: #333;
    }

    .highlight-2 {
      color: #0033aa;
    }

    .disclaimer {
      font-size: 13px;
      color: #333;
      margin-top: 20px;
    }

    .right-section {
      flex: 1.2;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
    }

    .form-group label {
      width: 120px;
      font-size: 18px;
      font-weight: bold;
      color: #003366;
    }

    .form-group input {
      flex: 1;
      padding: 8px 12px;
      border: 2px solid #5588bb;
      border-radius: 2px;
      font-size: 16px;
      background-color: #f5f5f5;
    }

    .button-container {
      text-align: right;
      margin-top: 25px;
    }

    .btn-image {
      border: none;
      background: #f5f5f5;
      padding: 0;
      cursor: pointer;
    }

    .btn-image img {
      display: block;
      height: auto;
      max-width: 180px;
    }

    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #225522;
      border-top: 1px dashed #ccc;
      padding-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo-container">
        <img src="images/boblox-classic (1).png" alt="VOX" class="logo-img">
      </div>
      <div class="welcome-text">
        <h2>Welcome to VOX!</h2>
        <p>A 3D game produced by ILIKE</p>
      </div>
    </div>

    <div class="main-content">
      <div class="left-section">
        <img src="https://www.image2url.com/r2/default/images/1788631165020-9e696b6d-6f61-47f4-94eb-515b2c37ff21.png" alt="3D Avatars" class="avatar-img">
      </div>

      <div class="right-section">
        <form id="signupForm" onsubmit="handleSubmit(event)">
          <div class="form-group">
            <label for="nametag">Nametag:</label>
            <input type="text" id="nametag" name="nametag" required>
          </div>

          <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
          </div>

          <div class="button-container">
            <button type="submit" class="btn-image">
              <img src="https://www.image2url.com/r2/default/files/1788415496866-a002e430-bc52-4e6a-a72c-a3abc7c50b8c.png" alt="Continue">
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="bottom-section">
      <div class="info-text">
        <p class="highlight-1"><strong>VOX</strong> is a quality game with worlds to explore!</p>
        <p class="highlight-2">And if your child is playing this game, Don't concern much, because we have the highest Moderation ever!</p>
      </div>

      <div class="disclaimer">
        <p>VOX not responsible for any hacking and viruses.</p>
      </div>

      <div class="footer">
        ILIKE TM
      </div>
    </div>
  </div>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      const targetHref = "1homepage.html"; 
      window.location.href = targetHref;
    }
  </script>

</body>
</html>
